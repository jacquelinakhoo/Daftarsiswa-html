<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>forms</title>
    </head>
    <body> 
        <a href="Day1index.html"><button>Kembali</button></a>
        <br>
        <br>
        <br><h2>Form Data Siswa</h2>
        <form action="Day1index.html" method="post">
        <p>
            <label>NIS</label>
            <input type="text" name="nis" placeholder="Masukkan NIS">
        </p>
        <p>
            <label>Nama</label>
            <input type="text" name="nama" placeholder="Masukkan Nama">
        </p>
        <p>
         <p>
                <label for="kelas">Kelas</label>
                <select name="kelas">
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </p>
            <label>Tanggal Lahir</label>
            <input type="date" name="tgl_lahir">
        </p>
        <p>
            <label>Jenis Kelamin</label>
            <input type="radio" name="jk" value="Laki-laki">Laki-laki
            <input type="radio" name="jk" value="Perempuan">Perempuan
            <input type="radio" name="jk" value="Lainnya">Lainnya
        </p>
        <p>
            <label> Foto</label>
            <input type="file" name="foto">
            <br>
            <INPUT TYPE="submit" value="Submit">
        </form>
    </body>
    </html>
