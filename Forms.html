<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>forms</title>
    </head>
    <body> 
        <a href="Day1index.html"><button>Kembali</button></a>
        <br>
        <br>
        <br><h2>Form Data Siswa</h2>
        <form action="youtubepage.html" method="get">
        
    <table>
        <tr>
            <td>
                <label>NIS</label>
            </td>
            <td>
                <input type="text" name="nis" placeholder="Masukkan NIS">
            </td>
        </tr>
        <tr>
            <td>
                <label>Nama</label>
            </td>
            <td>
                <input type="text" name="nama" placeholder="Masukkan Nama">
            </td>
        </tr>
        <tr>
            <td>
                <label for="kelas">Kelas</label>
            </td>
            <td>
                <select name="kelas">
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <label>Tanggal Lahir</label>
            </td>
            <td>
                <input type="date" name="tgl_lahir">
            </td>
        </tr>
        <tr>
            <td>
                <label>Jenis Kelamin</label>
            </td>
            <td>
                <input type="radio" name="jk" value="Laki-laki">Laki-laki
                <input type="radio" name="jk" value="Perempuan">Perempuan
                <input type="radio" name="jk" value="Lainnya">Lainnya
            </td>
        </tr>
        <tr>
            <td>
                <label> Foto</label>
            </td>
            <td>
                <input type="file" name="foto">
            </td>
        </tr>
    </table>
    <INPUT TYPE="submit" value="Submit">
        </form>
    </table>

    </body>
    </html>
